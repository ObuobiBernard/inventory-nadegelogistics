<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NADEGE Logistics · Inventory Management</title>

    <!-- ===== CSP (Content Security Policy) ===== -->
    <meta http-equiv="Content-Security-Policy" content="

        script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://unpkg.com;

        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        connect-src 'self' https://script.google.com;
        base-uri 'self';
    " />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET & BASE (same as before – omitted for brevity) ===== */
        /* ... (full CSS is long – I'll include it in the final code block) */
    </style>
</head>
<body>

    <!-- PASSWORD OVERLAY, SIDEBAR, MAIN CONTENT... all unchanged -->

    <!-- ===== SETTINGS MODAL (with fixed form) ===== -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3><i class="fas fa-cloud-upload-alt" style="color:var(--accent-gold);margin-right:8px;"></i>Sync Settings</h3>
                <button class="modal-close" onclick="closeModal('settingsModal')">&times;</button>
            </div>
            <!-- ✅ FIX: onsubmit now calls handleSettingsSubmit -->
            <form id="settingsForm" onsubmit="handleSettingsSubmit(event)">
                <div class="form-group">
                    <label>Google Apps Script Web App URL *</label>
                    <input type="url" id="gasUrl" placeholder="https://script.google.com/macros/s/.../exec" required />
                    <small style="color:var(--text-muted);font-size:12px;display:block;margin-top:4px;">Paste the URL from your Apps Script deployment.</small>
                </div>
                <div class="form-group">
                    <label>Secret Key *</label>
                    <input type="text" id="gasSecret" placeholder="Enter your secret key" required />
                    <small style="color:var(--text-muted);font-size:12px;display:block;margin-top:4px;">Must match the secret in your Apps Script code.</small>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn" onclick="closeModal('settingsModal')">Cancel</button>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== JAVASCRIPT (excerpt with corrections) ===== -->
    <script>
        // ... (configuration, utilities, IndexedDB helpers – same as before)

        // ============================================================
        //  SETTINGS – CORRECTED
        // ============================================================
        // Storage function (unchanged)
        async function saveSettings(settings) {
            await openDB();
            await dbPut('settings', { id: 'sync', ...settings });
        }

        // ✅ FIX: renamed from saveSettings to handleSettingsSubmit
        async function handleSettingsSubmit(e) {
            e.preventDefault();
            const url = document.getElementById('gasUrl').value.trim();
            const secret = document.getElementById('gasSecret').value.trim();
            if (!url || !secret) {
                showToast('Please fill in both fields.', 'error');
                return;
            }
            await saveSettings({ url, secret }); // now correctly calls the storage function
            closeModal('settingsModal');
            showToast('Settings saved successfully!', 'success');
            await logActivity('Settings updated', 'Sync settings changed');
        }

        // ============================================================
        //  EQUIPMENT RENDER – RENT/SELL BUTTONS FIX
        // ============================================================
        // Inside renderEquipment(), replace the table-actions section with:
        /*
        <td style="text-align:right;">
            <div class="table-actions" style="justify-content:flex-end;">
                ${!isDeleted ? `
                    ${e.available > 0 ? `
                        <button class="rent-btn" onclick="openRentalFromEquip('${e.id}')" title="Rent"><i class="fas fa-handshake"></i></button>
                        <button class="sale-btn" onclick="openSaleFromEquip('${e.id}')" title="Sell"><i class="fas fa-tag"></i></button>
                    ` : `
                        <span class="out-of-stock" title="No stock available">Out of stock</span>
                    `}
                    <button class="edit-btn" onclick="editEquipment('${e.id}')" title="Edit"><i class="fas fa-edit"></i></button>
                    <button class="delete-btn" onclick="deleteEquipment('${e.id}')" title="Delete"><i class="fas fa-trash"></i></button>
                ` : `
                    <button class="restore-btn" onclick="restoreEquipment('${e.id}')" title="Restore"><i class="fas fa-undo"></i></button>
                `}
            </div>
        </td>
        */

        // ============================================================
        //  OPEN MODAL FUNCTIONS – ADD STOCK CHECK
        // ============================================================
        async function openRentalFromEquip(equipId) {
            const equip = await getData('equipment');
            const item = equip.find(e => e.id === equipId);
            if (!item || item.available < 1) {
                showToast('❌ This item is currently out of stock.', 'error');
                return;
            }
            await populateRentalSelects(equipId);
            document.getElementById('rentalStart').value = today();
            document.getElementById('rentalEnd').value = today();
            document.getElementById('rentalQty').value = 1;
            openModal('rentalModal');
        }

        async function openSaleFromEquip(equipId) {
            const equip = await getData('equipment');
            const item = equip.find(e => e.id === equipId);
            if (!item || item.available < 1) {
                showToast('❌ This item is currently out of stock.', 'error');
                return;
            }
            await populateSaleSelects(equipId);
            openModal('saleModal');
        }

        // ... rest of the code (same as before)
    </script>
</body>
</html>
